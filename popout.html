<!DOCTYPE html>
<meta charset="utf-8">
<title>TRADE BOX</title>
<!--
  POP-OUT TRADE BOX  (served at /popout; opened from the ASSET INVENTORY header)

  Standalone on purpose. It does NOT reuse the dashboard's fire() — that
  function ends in loadToken()/refreshDashboard() and drives #chSym, #chPrice,
  #slipIn, #fcTarget, none of which exist here.

  TP/SL IS NOT COMPUTED HERE ANY MORE (2026-08-09). The watching and the
  selling both moved into the trader (tpsl.py) because a stop-loss cannot
  depend on this window being open — least of all this window, whose entire job
  is to sit behind a gmgn tab. This page renders /api/tpsl and posts settings
  back; it is a control surface, not the mechanism.

  PAPER MODE (2026-08-10). The same window drives two books: the live wallet,
  and a simulated one (paper.py) with its own journal, its own SOL balance and
  its own TP/SL executor instance. The toggle only changes which /api prefix
  every call uses — /api/... or /api/paper/... — and the two servers behind
  those prefixes share no code that can spend: PaperBook has no keypair, no
  signer and no RPC. So a mode mix-up cannot move real SOL; the worst case is a
  simulated trade you meant to make for real, or the reverse.

  That leaves ONE failure this window is responsible for, and it runs in both
  directions: believing you are in paper while spending real money, and
  believing a stop-loss guards a position that only the paper book holds. Hence
  the mode is painted from SRV.book — the SERVER's answer, every poll — and
  never from the local var, exactly as paintArm() already does for ARMED. If
  they ever disagree, the server wins and the skin follows it.

  Rules this page has to keep:
    * /api/buy and /api/sell FAST-ACK with status="submitted". A box that stops
      at "SENT" shows green for a trade that never landed, so every signature is
      polled through /api/tx/<sig> to a terminal state.
    * An ok:false from /api/tpsl replaces the rows with the error instead of
      leaving a stale list. Selling off a stale list is how you fire at a
      position you no longer hold.
    * Never claim protection this window cannot deliver. Every row states
      whether the SERVER will act on it (AUTO / AUTO OFF / MANUAL), read back
      from the executor each poll — never inferred from what was clicked here.
    * The wallet lives server-side (DPAPI session), so this window inherits the
      unlock. No key material here and nothing to unlock.
    * This page now does ZERO trade-class RPC: /api/tpsl is served from the
      executor's own snapshot, so leaving the box open all day costs nothing on
      the scarce Helius key. (It used to poll /api/holdings every 6s.)

  It is loaded two ways: as a normal document (window.open / a plain tab), and
  injected into a Document Picture-in-Picture window by the dashboard. Nothing
  here may assume it owns the top-level document — hence BASE below.
-->
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#090708;color:#e9ddd8;font-family:'JetBrains Mono',monospace;font-size:12px}
  body{padding:0 0 8px}
  a{color:#8a6a63}
  .bar{display:flex;align-items:center;gap:5px;padding:7px 10px;border-bottom:1px solid #2a0f11;
       flex-wrap:wrap;position:relative}
  .lbl{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;color:#7a6a63}
  .fm{padding:3px 8px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;
      background:#0d090a;color:#7a6a63;border:1px solid #3a1014;cursor:pointer}
  .fm.on{background:#2a0f11;color:#ff8a5c;border-color:#5a1518}
  /* ARMED is the one state in this window that means "software may spend my
     money without asking", so it does not share a colour with anything else. */
  .fm.armed{background:#0c1f16;color:#3ee89a;border-color:#1f5a3f;
            animation:armpulse 2s ease-in-out infinite}
  @keyframes armpulse{0%,100%{box-shadow:0 0 0 0 rgba(62,232,154,.5)}
                      50%{box-shadow:0 0 0 3px rgba(62,232,154,0)}}
  input{background:#070506;border:1px solid #4a1418;color:#e9ddd8;font-family:'JetBrains Mono',monospace;
        font-size:11px;padding:3px 5px;outline:none;width:46px}
  #ca{width:100%;font-size:11px;padding:5px 6px}
  #cabuy{padding:7px 10px;border-bottom:1px solid #2a0f11}
  #caInfo{font-size:10px;color:#7a6a63;margin:5px 0 0;line-height:1.4;min-height:13px}
  .buys{display:flex;gap:4px;margin-top:6px}
  .bb{flex:1;padding:5px 0;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1px;
      background:#0c1f16;color:#3ee89a;border:1px solid #1f5a3f;cursor:pointer}
  .bb:hover:not(:disabled){background:#123424}
  .bb:disabled{opacity:.35;cursor:default}
  #cbuy{flex:1;width:auto}
  .row{padding:7px 10px;border-bottom:1px solid #1a0e0f}
  .r1{display:flex;align-items:center;gap:6px}
  .sym{color:#e9ddd8;font-size:12px;font-weight:700}
  .usd{color:#3ee89a;font-size:12px;font-weight:700}
  .amt{color:#7a6a63;font-size:10px}
  .btns{display:flex;gap:4px;margin-top:5px}
  .sb{flex:1;padding:5px 0;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1px;
      background:#2a0d10;color:#ff5a5f;border:1px solid #5a1518;cursor:pointer}
  .sb:hover:not(:disabled){background:#3d1319}
  .sb:disabled{opacity:.4;cursor:default}
  .chartlink{color:#5ac8ff;font-size:10px;text-decoration:none;border:1px solid #1a4a5a;padding:1px 4px}
  .hx{background:none;border:1px solid #2a0f11;color:#5a4a45;font-size:10px;line-height:1;
      padding:2px 5px;cursor:pointer;font-family:'JetBrains Mono',monospace}
  .hx:hover{color:#ff5a5f;border-color:#5a1518}
  .row.off{opacity:.4}
  #hidbar{padding:5px 10px;font-size:10px;color:#5a4a45;text-align:right}
  #hidbar a{color:#8a6a63;cursor:pointer;text-decoration:underline}
  .pnl{font-size:10px;font-weight:700}
  .up{color:#3ee89a} .dn{color:#ff5a5f}
  /* alert banner: one per triggered position, with the sell one click away */
  .al{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11px;
      border-bottom:1px solid #2a0f11;animation:alpulse 1.1s ease-in-out infinite}
  .al.tp{background:#0c1f16;color:#3ee89a}
  .al.sl{background:#2a0d10;color:#ff5a5f}
  @keyframes alpulse{0%,100%{filter:none}50%{filter:brightness(1.5)}}
  .al button{font-family:'Share Tech Mono',monospace;font-size:10px;padding:3px 7px;cursor:pointer;
             background:#0d090a;border:1px solid #5a1518;color:#e9ddd8}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;
      align-items:flex-start;justify-content:center;padding:12px}
  .ovbox{width:100%;max-height:100%;overflow:auto;background:#0b0708;border:1px solid #5a1518;padding:10px 12px}
  .ovbox h1{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;
            color:#ff8a5c;font-weight:400;margin:0 0 8px}
  .ovrow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .ovrow .lbl{min-width:78px}
  .ovnote{font-size:9px;color:#7a6a63;line-height:1.45;margin:8px 0 0;border-top:1px solid #2a0f11;padding-top:8px}
  .note{padding:8px 10px;color:#8a6a63;font-size:11px}
  #log{padding:6px 10px;font-size:10px;line-height:1.5;max-height:132px;overflow-y:auto;border-top:1px solid #2a0f11}
  /* Hover-only, and ABSOLUTE on purpose: as a normal block it pushed the CA
     field and every sell button down by two lines the moment the pointer
     crossed a fee button. Buttons that move under the cursor in a window you
     trade from is worse than no hint at all. */
  #feeNote{display:none;position:absolute;top:100%;left:0;right:0;z-index:20;
           margin:0 6px;padding:6px 8px;font-size:9px;color:#8a6a63;line-height:1.45;
           background:#0d090a;border:1px solid #3a1014}
  #tot{padding:6px 10px 0;text-align:right;font-size:11px;color:#ffb020}

  /* ---- PAPER SKIN ----
     A whole-window repaint, not a badge. The point is that you cannot glance
     at this box and be wrong about which book you are firing into, so paper
     takes the one colour the live skin never uses anywhere (cyan; live is red
     / amber / the single green of ARMED) and states itself across the top.
     Applied to <html> from SRV.book, so it tracks the server, not the click. */
  html.paper body{background:#04090c;color:#dbe9ee}
  html.paper .bar,html.paper #cabuy{border-bottom-color:#0d3340}
  html.paper .row{border-bottom-color:#08222b}
  html.paper .fm{background:#061319;color:#5f8b99;border-color:#0d3340}
  html.paper .fm.on{background:#082a36;color:#38d0ff;border-color:#166a85}
  html.paper input{background:#04090c;border-color:#124f63;color:#dbe9ee}
  html.paper .sym{color:#dbe9ee}
  html.paper #paperbar{display:flex}
  html.paper #tot{color:#38d0ff}
  html.paper .ovbox{background:#04090c;border-color:#166a85}
  html.paper .ovbox h1{color:#38d0ff}
  /* SELL keeps its red and ARMED keeps its green: those two say "this is
     irreversible" and "software may act without you", and both are still true
     on paper. Only the chrome changes. */
  #paperbar{display:none;align-items:center;gap:6px;padding:4px 10px;
            background:#082a36;color:#38d0ff;border-bottom:1px solid #166a85;
            font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px}
  #paperbar b{color:#8ce8ff}
  #paperbar .eq{margin-left:auto;color:#8ce8ff}
</style>

<!-- No title bar. The window is already named TRADE BOX by <title>, so a header
     repeating it was pure chrome in a 390px window. The wallet total was the
     only DATA on that strip, so it moves down next to the holdings it totals. -->
<div class="bar">
  <span class="lbl">FEE</span>
  <button class="fm" data-m="mev">MEV</button>
  <button class="fm" data-m="fast">FAST</button>
  <button class="fm" data-m="eco">ECO</button>
  <span style="flex:1"></span>
  <span class="lbl">SLIP%</span><input id="slip" value="{{SLIP}}">
  <button id="book" class="fm" title="live wallet / paper book">LIVE</button>
  <button id="arm" class="fm" title="auto-sell">ARM</button>
  <button id="cog" class="fm" title="TP / SL settings">&#9881;</button>
  <div id="feeNote"></div>
</div>
<div id="paperbar">PAPER &mdash; SIMULATED, NO REAL SOL<span class="eq" id="paperEq"></span></div>
<div id="alerts"></div>

<div id="cabuy">
  <input id="ca" placeholder="paste CA to quick-buy" spellcheck="false" autocomplete="off">
  <div id="caInfo"></div>
  <div class="buys" id="buys"></div>
</div>

<div id="tot">&#8212;</div>
<div id="body"><div class="note">scanning wallet&#8230;</div></div>
<div id="hidbar"></div>
<div id="log"></div>

<script>
/* Document PiP injects this into a window whose document has no URL of its own,
   so every relative fetch would resolve against about:blank. BASE pins them to
   the trader that served this markup. Empty string in a normal document, where
   relative paths already work. */
var BASE=(function(){
  try{ if(location.protocol==='http:'||location.protocol==='https:') return ''; }catch(e){}
  try{ return window.__T8_BASE__||''; }catch(e){ return ''; }
})();
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* fee mode — shared with the dashboard under the same localStorage key.
   NOT defaulted to eco: cheapest is also the most likely to miss. */
var FEE={
  mev :{t:'Jito tip, no priority fee. Sandwich-resistant. Tip floor 2,000 lamports, ceiling 0.0003 ◎ — always costs something.'},
  fast:{t:'Priority fee "high", ceiling 0.002 ◎. Usually far under it; the ceiling only bites under congestion.'},
  eco :{t:'Priority fee "medium", ceiling 0.00005 ◎ — can be 0 on a calm book. Cheapest, and the most likely to miss a fast dump.'}
};
var mode='mev';
try{ var s=localStorage.getItem('t8_feeMode'); if(FEE[s]) mode=s; }catch(e){}
function paintFee(){
  // [data-m] is load-bearing, not tidiness: the cog button and the overlay's
// buttons reuse .fm purely for styling, and without this filter the loop below
// hits FEE[null].t and throws — which killed the whole script, leaving the box
// stuck on "scanning wallet..." with every later var undefined.
Array.prototype.forEach.call(document.querySelectorAll('.fm[data-m]'),function(b){
    b.className='fm'+(b.getAttribute('data-m')===mode?' on':'');});
}
/* The note is hover-only now. It shows the mode under the POINTER, not the
   active one — hovering ECO while on MEV is exactly the moment you want to
   read what ECO does. Also mirrored onto title= so it still reaches you on a
   touch screen, where there is no hover at all. */
function feeNote(m){
  var el=$('feeNote');
  if(!m){ el.style.display='none'; return; }
  el.textContent=FEE[m].t; el.style.display='block';
}
// [data-m] is load-bearing, not tidiness: the cog button and the overlay's
// buttons reuse .fm purely for styling, and without this filter the loop below
// hits FEE[null].t and throws — which killed the whole script, leaving the box
// stuck on "scanning wallet..." with every later var undefined.
Array.prototype.forEach.call(document.querySelectorAll('.fm[data-m]'),function(b){
  var m=b.getAttribute('data-m');
  b.title=FEE[m].t;
  b.onmouseenter=function(){ feeNote(m); };
  b.onmouseleave=function(){ feeNote(null); };
  b.onclick=function(){ mode=m;
    try{ localStorage.setItem('t8_feeMode',mode); }catch(e){}
    paintFee(); log('fee mode → '+mode.toUpperCase(),'#ffb020'); };
});
paintFee();

function log(html,col){
  var d=document.createElement('div'); d.style.color=col||'#8a6a63';
  d.innerHTML='<span style="color:#5a4a45">'+new Date().toLocaleTimeString()+'</span> '+html;
  $('log').insertBefore(d,$('log').firstChild);
  while($('log').childNodes.length>60) $('log').removeChild($('log').lastChild);
}

/* busy MUST be self-healing. It was cleared only on the line after the try, so
   any path that never returned — a fetch left hanging, the window torn down
   mid-await — pinned it true forever, and since refresh() early-returns on busy
   the box then sat frozen with every button dead. That is unrecoverable without
   a reload, which is the worst possible failure for a window you trade from.
   Now: cleared in a finally, and stale-checked so even a lost finally expires. */
var busy=false, busyAt=0;
var BUSY_MAX_MS=60000;
function busyStuck(){ return busy && (Date.now()-busyAt)>BUSY_MAX_MS; }
function setBusy(v){
  busy=v; busyAt=v?Date.now():0;
  Array.prototype.forEach.call(document.querySelectorAll('.sb'),function(b){ b.disabled=v; });
  paintBuys();
}

/* ---------- which book ----------
   BOOK is the INTENT (what was clicked / what was open last time). SRV.book is
   the TRUTH, and paintBook() only ever paints the truth — so if the trader has
   no paper book running, the skin stays live rather than lying about it.

   Every trade-class call goes through ep(), which is the only place the two
   books diverge on this page. /api/tx/<sig> is deliberately NOT routed: a paper
   fill returns status="confirmed" with a synthetic signature, so report() never
   reaches the poller, and a paper sig must never be looked up on chain. */
var BOOK=(function(){ try{ return localStorage.getItem('t8_book')==='paper'?'paper':'live'; }
                      catch(e){ return 'live'; } })();
function ep(p){ return (BOOK==='paper'?'/api/paper':'/api')+p; }

/* X-Sellbox tags every request from this box so the server lets it use the
   private RPC key; the main dashboard does not send it and runs on public. */
async function jget(u){ var r=await fetch(BASE+u,{headers:{'X-Sellbox':'1'}}); return r.json(); }
async function jpost(u,b){
  var r=await fetch(BASE+u,{method:'POST',headers:{'Content-Type':'application/json','X-Sellbox':'1'},
                           body:JSON.stringify(b)});
  return r.json();
}

/* ---------- quick buy ---------- */
/* Solana mints are base58 and never 0x-prefixed. The server rejects EVM with
   "view-only", but catching it here means the buttons are dead before he
   clicks rather than after — this window is meant to be fired at fast. */
var SOL_RE=/^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
var TOK={mint:null, sym:null, ok:false};
function buyReady(){ return TOK.ok && (!busy || busyStuck()); }
function paintBuys(){
  Array.prototype.forEach.call(document.querySelectorAll('.bb'),function(b){
    b.disabled=!buyReady(); });
}
[0.05,0.1,0.25,0.5,1].forEach(function(a){
  var b=document.createElement('button'); b.className='bb'; b.textContent=a+' ◎';
  b.disabled=true; b.onclick=function(){ buy(a); }; $('buys').appendChild(b);
});
(function(){
  var i=document.createElement('input'); i.id='cbuy'; i.placeholder='custom ◎';
  i.addEventListener('keydown',function(e){
    if(e.key==='Enter'){ var a=parseFloat(i.value); if(a>0&&buyReady()) buy(a); }});
  $('buys').appendChild(i);
})();

var caTimer=null;
$('ca').addEventListener('input',function(){
  clearTimeout(caTimer); caTimer=setTimeout(resolveCA,250);
});
/* A real paste is a deliberate act, so skip the 250ms debounce and resolve at
   once. The debounce only exists to avoid a lookup per keystroke when typing. */
$('ca').addEventListener('paste',function(){
  setTimeout(function(){ clearTimeout(caTimer); resolveCA(); },0);   // let the value land first
});
/* One-click paste: click the field and it takes the clipboard, replacing
   whatever was there, and resolves immediately. Saves click -> ctrl+A -> ctrl+V
   on every token.

   Only auto-pastes when the clipboard actually LOOKS like a Solana mint —
   otherwise it selects the text instead, so a manual ctrl+V still replaces
   rather than appends, and clicking the field to read it does not wipe it with
   whatever unrelated thing you last copied.

   readText() needs clipboard-read permission; Chrome prompts once per origin.
   Every failure path (denied, no API, DuckDuckGo) falls back to select(). */
async function quickPaste(){
  var el=$('ca');
  try{
    if(!navigator.clipboard || !navigator.clipboard.readText){ el.select(); return; }
    var txt=(await navigator.clipboard.readText()||'').trim();
    if(!SOL_RE.test(txt)){ el.select(); return; }
    if(txt===el.value){ return; }               // already loaded — leave it alone
    el.value=txt; clearTimeout(caTimer); resolveCA();
  }catch(e){ el.select(); }
}
$('ca').addEventListener('click',quickPaste);
async function resolveCA(){
  var ca=($('ca').value||'').trim();
  TOK={mint:null,sym:null,ok:false}; paintBuys();
  if(!ca){ $('caInfo').textContent=''; return; }
  if(!SOL_RE.test(ca)){
    $('caInfo').innerHTML='<span style="color:#ff5a5f">not a Solana mint — this box is Solana-only</span>';
    return;
  }
  $('caInfo').textContent='looking up…';
  var j;
  try{ j=await jget(ep('/token/'+encodeURIComponent(ca))); }
  catch(e){ $('caInfo').innerHTML='<span style="color:#ff5a5f">lookup failed</span>'; return; }
  if(!j||!j.ok){
    $('caInfo').innerHTML='<span style="color:#ff5a5f">'+esc((j&&j.error)||'lookup failed')+'</span>';
    return;
  }
  if(j.evm){
    $('caInfo').innerHTML='<span style="color:#ff5a5f">EVM token — view-only here</span>';
    return;
  }
  TOK={mint:ca, sym:j.symbol||ca.slice(0,4), ok:true};
  $('caInfo').innerHTML='<b style="color:#e9ddd8">'+esc(TOK.sym)+'</b>'+
    (j.usdPrice?' <span style="color:#8a6a63">$'+Number(j.usdPrice).toPrecision(5)+'</span>':'')+
    (j.balance?' <span style="color:#ffb020">holding '+Number(j.balance).toLocaleString()+'</span>':'')+
    ' <a class="chartlink" target="_blank" href="https://gmgn.ai/sol/token/'+esc(ca)+'">GMGN</a>';
  paintBuys();
}

async function buy(sol){
  if(!buyReady()) return;
  var label=(BOOK==='paper'?'PAPER ':'')+'BUY '+sol+' ◎ '+(TOK.sym||'');
  setBusy(true); log(label+' — SENDING… ['+mode.toUpperCase()+']','#ffb020');
  try{
    var j=await jpost(ep('/buy'),{mint:TOK.mint,sol:sol,
                                  slippageBps:slipBps(),feeMode:mode,wait:false});
    report(j,label);
  }catch(e){ var x=explainErr(e); log(label+' <b style="color:#ff5a5f">ERROR</b> — '+esc(x.t)+(x.hint?' <span style="color:#7a6a63">('+esc(x.hint)+')</span>':''),'#ff5a5f'); }
  finally{ setBusy(false); }
  refresh();
}

/* ---------- holdings ---------- */
/* ---------- TP / SL ----------
   THE WATCHING AND THE SELLING BOTH HAPPEN ON THE SERVER NOW (tpsl.py).

   This used to be a browser-side alert loop, and it could not be anything more:
   a stop-loss whose liveness depends on a Document-PiP window staying open —
   in a window whose whole job is to sit behind a gmgn tab — is not a stop-loss.
   Close the window, sleep the machine, and the protection silently went away.

   So this file no longer computes TP/SL at all. It renders /api/tpsl and posts
   settings back. Everything it displays (PnL, price age, armed state, which
   side is confirming, why a position is unprotected) is the SAME state the
   executor decides on, which is the point: you cannot be looking at one number
   while it sells against another.

   It also means this window does ZERO trade-class RPC of its own — /api/tpsl is
   served from the executor's snapshot, so leaving the box open all day no
   longer touches the scarce Helius key on a 6s timer.

   What still lives here: the ARM switch (auto-sell is off on every restart and
   only a human turns it on), the one-click SELL for positions the executor is
   NOT allowed to trade for you, and the sound. */
var SRV={armed:false,positions:[],events:[],cfg:{},per:{},last_error:null,running:false};

/* A position is auto-protected only when the server says basis=="ok" — i.e.
   entry price came from chain-verified fills AND the on-chain balance agrees.
   Anything else still shows a PnL and still raises the old one-click banner;
   it just never sells by itself. That distinction is the whole safety model,
   so it is rendered explicitly rather than implied by a missing badge. */
function limitsFor(mint){
  var o=SRV.per[mint]||{};
  return {tp:(o.tp!=null&&o.tp!=='')?+o.tp:+(SRV.cfg.tp_pct||55),
          sl:(o.sl!=null&&o.sl!=='')?+o.sl:+(SRV.cfg.sl_pct||40)};
}

var SOUND=(function(){ try{ return localStorage.getItem('t8_tpsl_snd')!=='0'; }
                       catch(e){ return true; } })();
var BEEPED={};              // mint -> last kind we beeped for, so it beeps once
var MUTED={};               // mint -> kind dismissed, cleared on re-entering band

var actx=null;
function beep(kind){
  if(!SOUND) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();   // Chrome needs a prior gesture
    var o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.frequency.value = kind==='tp' ? 880 : 320;  // up = good, low = stop
    g.gain.setValueAtTime(0.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,actx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.45);
    o.start(); o.stop(actx.currentTime+0.46);
  }catch(e){}
}

function livePnl(h){ return h.pnl_pct!=null?h.pnl_pct:null; }

/* The banner is now for positions the executor CANNOT trade for you.

   When a position is auto-protected the executor sells it; a flashing "do
   something" banner over a thing already being handled is exactly the kind of
   noise you learn to ignore, and then miss the one that mattered. So an armed,
   protected position that crosses its line shows its state inline and the
   banner stays quiet.

   An UNPROTECTED position crossing its line is the opposite: nothing is going
   to happen unless you click. That is what this banner is for, and it is the
   old one-click SELL, unchanged. */
function checkAlerts(){
  var hits=[];
  SRV.positions.forEach(function(h){
    var p=h.pnl_pct; if(p==null) return;
    var L=limitsFor(h.mint);
    var hit = p>=L.tp ? 'tp' : (p<=-Math.abs(L.sl) ? 'sl' : null);
    // back inside the band -> re-arm both the beep and the mute
    if(!hit){ BEEPED[h.mint]=null; MUTED[h.mint]=null; return; }
    // Armed AND protected -> the server has this. Beep once so you know it
    // fired, but do not demand a click.
    var handled = SRV.armed && h.protected;
    if(!handled && MUTED[h.mint]!==hit)
      hits.push({h:h,kind:hit,pnl:p,lim:hit==='tp'?L.tp:-Math.abs(L.sl)});
    if(BEEPED[h.mint]!==hit){ BEEPED[h.mint]=hit; beep(hit); }
  });
  renderAlerts(hits);
}
function renderAlerts(hits){
  var box=$('alerts');
  if(!hits.length){ box.innerHTML=''; return; }
  box.innerHTML='';
  hits.forEach(function(x){
    var d=document.createElement('div'); d.className='al '+x.kind;
    d.innerHTML='<b>'+esc(x.h.symbol||'?')+'</b><span>'+(x.pnl>=0?'+':'')+x.pnl+'%</span>'+
      '<span style="opacity:.7">'+(x.kind==='tp'?'TP':'SL')+' '+x.lim+'%</span>'+
      // WHY you are being asked to click, not just that you are. "unprotected"
      // alone reads as a badge; the reason is what tells you if it is fixable.
      '<span style="opacity:.7;font-size:9px">'+esc(x.h.unprotected||'not auto-protected')+'</span>'+
      '<span style="flex:1"></span>';
    var s=document.createElement('button'); s.textContent='SELL 100%';
    s.onclick=function(){ sell(x.h,100); };
    var m=document.createElement('button'); m.textContent='mute';
    m.title='hide this banner until it re-crosses the line';
    // MUTE USED TO LAST 3 SECONDS. It set FIRED[mint]='muted', which failed the
    // `FIRED[mint]!==hit` test on the very next tick, so it re-beeped and the
    // banner came straight back. Muting is now real state the re-render honours.
    m.onclick=function(){ MUTED[x.h.mint]=x.kind; checkAlerts(); };
    d.appendChild(s); d.appendChild(m);
    box.appendChild(d);
  });
}

/* Per-position hide.
   Scoped to a POSITION, not a token: on every refresh, hidden mints you no
   longer hold are dropped from the set. Otherwise hiding a token, selling it,
   then buying it again months later would leave the new position invisible in
   the one window you sell from — a silent way to lose money. */
var HIDDEN=(function(){
  try{ return new Set(JSON.parse(localStorage.getItem('t8_hidden')||'[]')); }
  catch(e){ return new Set(); }
})();
var showHidden=false;
function saveHidden(){
  // Array.from, NOT Array.prototype.slice.call — a Set is not array-like (no
  // length, no index access), so slice.call returns [] and this silently
  // persisted nothing. The habit comes from the NodeList calls elsewhere in
  // this file, where it is correct.
  try{ localStorage.setItem('t8_hidden',JSON.stringify(Array.from(HIDDEN))); }catch(e){}
}
function setHidden(mint,on){
  if(on) HIDDEN.add(mint); else HIDDEN.delete(mint);
  saveHidden(); render();
}

var rows=[];
async function refresh(){
  if(busy && !busyStuck()) return;       // never repaint mid-trade — unless busy is stale
  var j;
  // /api/tpsl, NOT /api/holdings: the executor already holds this snapshot, so
  // reading it costs no RPC at all. It also guarantees the box and the seller
  // are looking at one set of numbers.
  try{ j=await jget(ep('/tpsl')); }
  catch(e){ return fail('trader unreachable — is jup_trader.py still running?'); }
  if(!j||!j.ok) return fail(esc((j&&j.error)||'executor unavailable'));
  SRV=j;
  paintArm(); paintBook();
  // total stays the WALLET total and keeps counting hidden rows — hiding is a
  // display choice, and a total that silently excluded them would be a lie.
  $('tot').textContent=(j.total_usd!=null?'$'+Number(j.total_usd).toFixed(2):'—')+
                       (j.sol_balance!=null?' + '+Number(j.sol_balance).toFixed(3)+' ◎':'');
  paintPaperBar();
  rows=j.positions||[];
  var held={}; rows.forEach(function(h){ held[h.mint]=1; });
  var pruned=false;
  Array.from(HIDDEN).forEach(function(m){       // snapshot: we delete while iterating
    if(!held[m]){ HIDDEN.delete(m); pruned=true; }
  });
  if(pruned) saveHidden();
  render();
}

/* One line per position saying exactly what is guarding it and what that guard
   is currently doing. The reason text comes from the executor, not from a
   guess here — if the two ever disagreed, this window would be the last place
   you would find out. */
function statusLine(h){
  var L=limitsFor(h.mint), lim='TP '+L.tp+'% / SL '+L.sl+'%';
  var cls, txt;
  if(!h.protected){
    cls='dn'; txt='MANUAL — '+esc(h.unprotected||'not auto-protected');
  } else if(!SRV.armed){
    cls=''; txt='AUTO OFF — '+lim;
  } else {
    cls='up'; txt='AUTO '+lim;
  }
  // live detail: confirming 1/2, cooldown, already fired, stale feed
  var det='';
  if(h.reason && h.protected && SRV.armed) det=' · '+esc(h.reason);
  else if(h.price_age_s!=null && h.price_age_s>15) det=' · price '+h.price_age_s+'s old';
  return '<div style="font-size:9px;margin-top:3px" class="'+cls+'">'+txt+
         '<span style="color:#7a6a63">'+det+'</span></div>';
}

/* ARM is the only control that lets this thing spend money, so it is a
   deliberate, unmistakable toggle rather than a checkbox in the settings
   overlay — and it always shows the CURRENT server state, not what was last
   clicked here. It reads back from /api/tpsl every poll, so a second window,
   or a trader restart, can never leave this one claiming "ARMED" over a
   disarmed executor. */
function paintArm(){
  var b=$('arm'); if(!b) return;
  var live=SRV.armed;
  b.textContent=live?'ARMED':'ARM';
  b.className='fm'+(live?' armed':'');
  b.title=live
    ? 'Auto-sell is LIVE. Positions marked AUTO will be sold by the server at their TP/SL without you.'
    : 'Auto-sell is OFF — TP/SL only alerts. Click to let the server sell for you.';
  if(!SRV.running) { b.textContent='NO EXEC'; b.title='executor not running on the trader'; }
}
/* LIVE / PAPER, painted from SRV.book — never from BOOK.
   The skin is a claim about where the money goes, so it may only ever reflect
   what actually answered the last poll. Until a poll lands (or if the paper
   book is not running on this trader) the window stays in its live skin: the
   safe direction to be wrong is "you think it is real when it is not". */
function paintBook(){
  var b=$('book'); if(!b) return;
  // No confirmed answer yet (first paint, or the poll failed): show the INTENT
  // with a question mark and keep the live skin. An unconfirmed state must not
  // paint a claim — "PAPER" on this window means the server told us so.
  if(!SRV.book){
    document.documentElement.className='';
    b.textContent=BOOK==='paper'?'PAPER?':'LIVE?';
    b.className='fm';
    b.title='waiting for the trader to confirm which book this is';
    return;
  }
  var live=(SRV.book!=='paper');
  document.documentElement.className=live?'':'paper';
  b.textContent=live?'LIVE':'PAPER';
  b.className='fm'+(live?'':' on');
  b.title=live
    ? 'LIVE — buys and sells spend real SOL from the unlocked wallet. Click for the paper book.'
    : 'PAPER — simulated fills off real Jupiter quotes, logged to paper_trades.jsonl. No real SOL can move.';
  // The window is named by <title> in the taskbar and the PiP chrome, which is
  // often the only part of it visible when it sits behind gmgn.
  try{ document.title=live?'TRADE BOX':'PAPER TRADE BOX'; }catch(e){}
}
function paintPaperBar(){
  var e=$('paperEq'); if(!e) return;
  var s=SRV.stats;
  if(SRV.book!=='paper'||!s){ e.textContent=''; return; }
  // net_sol, NOT the sum of per-trade realized: the per-trade number is net of
  // its exit fee but not its entry fee, so summing it overstates. net_sol is
  // cash + capital-at-cost - bankroll, which has every fee already in it.
  // Open positions' unrealized moves are NOT here — each row shows its own,
  // and adding them would double-count what is on screen just below.
  var r=Number(s.net_sol||0);
  e.innerHTML='bank '+Number(s.start_sol).toFixed(2)+' ◎ &middot; P&amp;L '+
    '<b style="color:'+(r>=0?'#3ee89a':'#ff5a5f')+'">'+(r>=0?'+':'')+r.toFixed(4)+' ◎</b>'+
    (s.sells?' &middot; '+s.wins+'/'+s.sells+(s.win_rate!=null?' ('+s.win_rate+'%)':''):'')+
    ' &middot; fees '+Number(s.fees_sol||0).toFixed(4)+' ◎';
}
async function toggleBook(){
  var want=(BOOK==='paper')?'live':'paper';
  // Going LIVE is the direction that can spend money, so it is the one that
  // asks. Going to paper never needs a confirm.
  if(want==='live' && !confirm('Switch to the LIVE wallet?\n\n'+
        'Buy and sell buttons will spend real SOL.')) return;
  BOOK=want;
  try{ localStorage.setItem('t8_book',BOOK); }catch(e){}
  // Drop the old book's rows AT ONCE. Repainting the new skin over positions
  // fetched from the other book — even for one 3s poll — is exactly the state
  // where you would click SELL on the wrong thing.
  rows=[]; SRV={armed:false,positions:[],events:[],cfg:{},per:{},book:BOOK,
                last_error:null,running:false};
  BEEPED={}; MUTED={};
  render(); renderAlerts([]); paintBook(); paintArm();
  $('tot').textContent='—';
  log('book → <b>'+BOOK.toUpperCase()+'</b>'+
      (BOOK==='paper'?' — simulated, no real SOL':' — real money'),
      BOOK==='paper'?'#38d0ff':'#ffb020');
  await tickView();
}
async function toggleArm(){
  var want=!SRV.armed;
  if(want && !confirm(SRV.book==='paper'
      ? 'Arm PAPER auto-sell?\n\nThe server will close paper positions marked '+
        'AUTO at their TP/SL. No real SOL is involved.'
      : 'Arm auto-sell?\n\nThe server will sell positions marked AUTO '+
        'at their TP/SL with no further confirmation, even with this '+
        'window closed.')) return;
  try{
    var j=await jpost(ep('/tpsl/arm'),{armed:want});
    if(!j||!j.ok){ log('ARM failed: '+esc((j&&j.error)||'?'),'#ff5a5f'); return; }
    SRV.armed=j.armed; paintArm();
    log('auto-sell '+(j.armed?'<b style="color:#3ee89a">ARMED</b>':'<b>DISARMED</b>'),
        j.armed?'#3ee89a':'#ffb020');
  }catch(e){ log('ARM failed: '+esc(e),'#ff5a5f'); }
  refresh();
}

function render(){
  var box=$('body');
  if(!rows.length){ box.innerHTML='<div class="note">no token holdings over threshold</div>';
                    $('hidbar').innerHTML=''; return; }
  box.innerHTML='';
  rows.forEach(function(h){
    var off=HIDDEN.has(h.mint);
    if(off && !showHidden) return;
    var d=document.createElement('div'); d.className='row'+(off?' off':'');
    d.innerHTML='<div class="r1"><span class="sym">'+esc(h.symbol||'?')+'</span>'+
      '<span class="amt">'+Number(h.amount).toLocaleString()+'</span>'+
      // A just-bought token usually has no Jupiter price for a minute or two.
      // It is still sellable — the sell path needs mint and pct, not a price —
      // so it renders as "no px" rather than a misleading $0.00.
      '<span style="flex:1"></span>'+
      (function(){ var p=livePnl(h);
        if(p!=null) return '<span class="pnl '+(p>=0?'up':'dn')+'">'+(p>=0?'+':'')+p+'%</span>';
        // Say WHY there is no number. A blank reads as "flat"; this reads as
        // "we do not know", which is the truth and is why it cannot sell.
        var why = h.basis==='incomplete'
          ? 'you hold MORE than the trade journal accounts for, so entry price is unknown — no TP/SL on this one'
          : h.basis==='stale'
          ? 'you hold LESS than the journal accounts for — this token was exited somewhere other than this app, so the old lot is still on the books. Averaging it into the current position is what would print a wildly wrong % (FROGGY showed -86% on a near-flat position), so no number is shown at all.'
          : 'no confirmed buy on record for this position — entry price unknown, no TP/SL';
        return '<span class="pnl" style="color:#7a6a63" title="'+why+'">'+
          (h.basis==='incomplete'?'basis?':h.basis==='stale'?'stale?':'—')+'</span>'; })()+
      '<span class="usd"'+(h.priced?'':' style="color:#ffb020"')+'>'+
      (h.priced?'$'+Number(h.usd).toFixed(2):'no px')+'</span>'+
      '<a class="chartlink" target="_blank" href="https://gmgn.ai/sol/token/'+esc(h.mint)+'">GMGN</a>'+
      '<button class="hx" title="'+(off?'show this position again':'hide this position')+'">'+(off?'+':'✕')+'</button></div>'+
      // PROTECTION LINE. The single most important thing about a position is
      // whether anything is actually guarding it, so it gets its own row rather
      // than a colour on an existing one. Three states, never ambiguous:
      //   AUTO      armed + chain-verified basis -> the server will sell this
      //   AUTO OFF  it COULD be auto-sold, but the executor is disarmed
      //   MANUAL    it cannot be auto-sold, and the reason is printed
      statusLine(h)+
      '<div class="btns"></div>';
    d.querySelector('.hx').onclick=function(){ setHidden(h.mint,!off); };
    var bs=d.querySelector('.btns');
    // 10 replaces 75: a small scalp off a runner is the size you actually reach
    // for, and 75% was only ever "100 but not quite".
    [10,25,50,100].forEach(function(p){
      var b=document.createElement('button'); b.className='sb'; b.textContent=p+'%';
      b.onclick=function(){ sell(h,p); }; bs.appendChild(b); });
    box.appendChild(d);
  });
  // Hidden rows are never silently gone — the count stays on screen so a
  // position you forgot about is always one click from being visible again.
  var n=rows.filter(function(h){ return HIDDEN.has(h.mint); }).length;
  $('hidbar').innerHTML = n
    ? n+' hidden &middot; <a id="hidTog">'+(showHidden?'collapse':'show')+'</a>'
    : '';
  if($('hidTog')) $('hidTog').onclick=function(){ showHidden=!showHidden; render(); };
}
function fail(msg){
  // Explicit, not a silent catch: a blank/stale box invites a sell into nothing.
  $('tot').textContent='—';
  // Name the book. "executor not running" is two different problems depending
  // on which one answered, and the paper book is the one that may legitimately
  // be absent on an older trader process.
  $('body').innerHTML='<div class="note" style="color:#ff5a5f">['+
    esc(BOOK.toUpperCase())+'] '+msg+
    (BOOK==='paper'?'<br><span style="color:#7a6a63">if this trader predates paper mode, '+
      'restart it or switch back to LIVE</span>':'')+'</div>';
  rows=[];
  SRV.book=null; paintBook();          // stop claiming a book that did not answer
  $('paperEq').textContent='';
}

/* ---------- sell ---------- */
function slipBps(){ return Math.round(parseFloat($('slip').value||'3')*100); }
async function sell(h,pct){
  if(busy) return;
  var label=(BOOK==='paper'?'PAPER ':'')+'SELL '+pct+'% '+(h.symbol||'?');
  setBusy(true); log(label+' — SENDING… ['+mode.toUpperCase()+']','#ffb020');
  try{
    var j=await jpost(ep('/sell'),{mint:h.mint,pct:pct,slippageBps:slipBps(),
                                   feeMode:mode,wait:false});
    report(j,label);
  }catch(e){ var x=explainErr(e); log(label+' <b style="color:#ff5a5f">ERROR</b> — '+esc(x.t)+(x.hint?' <span style="color:#7a6a63">('+esc(x.hint)+')</span>':''),'#ff5a5f'); }
  finally{ setBusy(false); }
  refresh();
}

/* Turn a server error into something that says what happened and what to do.
   The trade box used to print the raw string, which for a rate-limited buy was
   "Expecting value: line 1 column 1 (char 0)" — a JSON decoder complaining that
   Jupiter's 429 body is plain text. That names neither the cause nor the fix,
   and it is the message you get at the exact moment you are trying to trade. */
function explainErr(e){
  var s=String(e||'unknown');
  var low=s.toLowerCase();
  if(low.indexOf('429')>=0 || low.indexOf('rate limit')>=0)
    return {t:'RATE LIMITED by Jupiter — nothing was sent, no SOL moved. '+
              'The free API tier is throttling us; wait a few seconds and fire again.',
            hint:'if this keeps happening the price poll is eating the budget — check /api/pxdiag'};
  if(low.indexOf('expecting value')>=0 || low.indexOf('non-json')>=0)
    return {t:'Jupiter returned a non-JSON response (usually a throttle or an outage). '+
              'Nothing was sent.', hint:'retry in a few seconds'};
  if(low.indexOf('no route')>=0 || low.indexOf('not tradable')>=0)
    return {t:'No routable pool for this token yet — nothing was sent.',
            hint:'a brand-new token, or a stonk.fun coin that just graduated, has no route for a few seconds while its pool is indexed: retry'};
  if(low.indexOf('no balance')>=0)
    return {t:'No balance to sell — the position may already be closed.', hint:''};
  if(low.indexOf('insufficient')>=0)
    return {t:'Insufficient SOL for this trade plus fees — nothing was sent.', hint:''};
  if(low.indexOf('slippage')>=0)
    return {t:'Slippage exceeded — the price moved past your tolerance before it landed.',
            hint:'raise SLIP% or use MEV to avoid being sandwiched'};
  if(low.indexOf('wallet')>=0 && low.indexOf('lock')>=0)
    return {t:'Wallet is locked — unlock it in the dashboard first.', hint:''};
  return {t:s, hint:''};
}

function report(j,label){
  if(!j||!j.signature){
    var e=explainErr((j&&j.error)||'unknown');
    log(label+' <b style="color:#ff5a5f">FAILED</b> — '+esc(e.t)+
        (e.hint?' <span style="color:#7a6a63">('+esc(e.hint)+')</span>':''),'#ff5a5f');
    return; }
  // A paper fill is terminal on arrival (status="confirmed", synthetic sig, no
  // solscan) so it takes the else-branch below and never reaches poll() — which
  // is right: a paper signature must never be looked up on chain.
  var via=(j.paper?'paper':(j.sent_via==='jito'?'jito':'rpc'))+' · '+esc(j.fee_mode||mode)+
          (j.paper?(j.fee_sol!=null?' fee '+j.fee_sol+'◎':'')
                  :(j.fee_cap_sol!=null?' ≤'+j.fee_cap_sol+'◎':''));
  var scan=j.solscan?' <a href="'+esc(j.solscan)+'" target="_blank">solscan</a>':'';
  var note=j.note?' <span style="color:#7a6a63">— '+esc(j.note)+'</span>':'';
  if(j.status==='submitted'){
    log(label+' → <b style="color:#ffb020">SENT</b> '+(j.elapsed_s||'')+'s via '+via+scan+' — confirming…','#ffb020');
    poll(j.signature,label,j.solscan);
  } else {
    log(label+' → <b style="color:'+(j.ok?'#3ee89a':'#ff5a5f')+'">'+esc(j.status)+'</b> via '+via+scan+
        (j.error?' — '+esc(j.error):note), j.ok?'#3ee89a':'#ff5a5f');
  }
}

async function poll(sig,label,scan){
  for(var i=0;i<50;i++){
    await new Promise(function(r){ setTimeout(r,600); });
    try{
      var s=await jget('/api/tx/'+sig);
      if(s.status==='confirmed'||s.status==='failed'){
        var ok=s.status==='confirmed';
        // A LANDED FAILURE IS NOT THE SAME AS A SEND FAILURE, and it used to
        // print as raw JSON: {"InstructionError":[3,{"Custom":6001}]}. That is
        // a lookup key, not an explanation — and the number means different
        // things in different programs. The server now reads the tx logs and
        // says which program threw and what it means; show THAT, and keep the
        // raw code visible underneath so it stays searchable.
        var detail='';
        if(!ok){
          detail=' — '+esc(s.reason||s.error||'rejected on-chain');
          if(s.name||s.code!=null)
            detail+=' <span style="color:#7a6a63">['+esc(s.name||('error '+s.code))+
                    (s.program_name?' · '+esc(s.program_name):(s.program?' · '+esc(String(s.program).slice(0,8))+'…':''))+']</span>';
        }
        log(label+' → <b style="color:'+(ok?'#3ee89a':'#ff5a5f')+'">'+s.status.toUpperCase()+'</b>'+
            (scan?' <a href="'+esc(scan)+'" target="_blank">solscan</a>':'')+detail,
            ok?'#3ee89a':'#ff5a5f');
        refresh();
        return;
      }
    }catch(e){}
  }
  log(label+' — confirm poll timed out, check solscan','#ff5a5f');
}

/* ---------- settings overlay ---------- */
/* The paper block only exists in the paper skin. Its job is to state what the
   simulation does NOT model, because that is the only way a paper result can
   be read honestly — an unqualified paper P&L is the most misleading number
   this whole app could show. */
function paperPanel(){
  if(SRV.book!=='paper') return '';
  var p=SRV.paper||{}, s=SRV.stats||{};
  return '<h1 style="margin-top:12px">PAPER BOOK</h1>'+
    '<div class="ovrow"><span class="lbl">BANKROLL</span><input id="pBank" value="'+
      esc(p.start_sol==null?5:p.start_sol)+'"><span class="lbl">◎</span>'+
      '<span style="flex:1"></span><button class="fm" id="pReset">RESET BOOK</button></div>'+
    '<div class="ovrow"><span class="lbl">HAIRCUT</span><input id="pHair" value="'+
      esc(p.fill_haircut_bps==null?0:p.fill_haircut_bps)+'">'+

    '<div class="ovrow"><span class="lbl">TOKEN RENT</span>'+
      '<button class="fm'+(p.charge_ata_rent?' on':'')+'" id="pRent">'+
      (p.charge_ata_rent?'CHARGED':'OFF')+'</button>'+
      '<span class="lbl">'+esc((p.ata_rent_sol||0).toFixed?p.ata_rent_sol.toFixed(5):p.ata_rent_sol)+' ◎ per new token</span></div>'+
    '<div class="ovnote"><b style="color:#8ce8ff">What this book models.</b> Fills come from a REAL '+

    '<br><br><b style="color:#8ce8ff">What it does not.</b> You fill at the quote\'s EXPECTED output, '+

    'sandwich, or the fact that your real order would have moved the book. '+
    '<b style="color:#e9ddd8">Treat any paper edge under ~3% as noise.</b> HAIRCUT exists to price '+
    'that pessimism in if you want it.'+
    '<br><br>Rows land in <b>'+esc(p.journal||'paper_trades.jsonl')+'</b> in the same schema as the real '+
    'journal, marked <b>fill:"sim"</b> and wallet <b>PAPER</b>, so nothing can confuse them for real '+
    'fills. RESET starts a new epoch with a fresh bankroll and keeps the old rows in the file.'+
    (s.resets?' This book has been reset '+s.resets+'&times;.':'')+'</div>';
}
function cogClose(){ var o=$('ovl'); if(o) o.remove(); }
function cogOpen(){
  cogClose();
  var ov=document.createElement('div'); ov.className='ov'; ov.id='ovl';
  var C=SRV.cfg||{}, gtp=C.tp_pct==null?55:C.tp_pct, gsl=C.sl_pct==null?40:C.sl_pct;
  var per=rows.map(function(h){
    var o=SRV.per[h.mint]||{};
    return '<div class="ovrow"><span class="lbl" title="'+esc(h.mint)+'">'+esc(h.symbol||'?')+'</span>'+
      'TP <input class="ptp" data-m="'+esc(h.mint)+'" value="'+esc(o.tp==null?'':o.tp)+'" placeholder="'+gtp+'">'+
      'SL <input class="psl" data-m="'+esc(h.mint)+'" value="'+esc(o.sl==null?'':o.sl)+'" placeholder="'+gsl+'"></div>';
  }).join('');
  ov.innerHTML='<div class="ovbox">'+
    '<h1>TP / SL &mdash; SERVER SIDE</h1>'+
    '<div class="ovrow"><span class="lbl">TAKE PROFIT</span><input id="sTp" value="'+gtp+'"><span class="lbl">%</span>'+
      '<span style="flex:1"></span><span class="lbl">SELL</span><input id="sTpAmt" value="'+(C.tp_sell_pct==null?100:C.tp_sell_pct)+'"><span class="lbl">%</span></div>'+
    '<div class="ovrow"><span class="lbl">STOP LOSS</span><input id="sSl" value="'+gsl+'"><span class="lbl">% below entry</span>'+
      '<span style="flex:1"></span><span class="lbl">SELL</span><input id="sSlAmt" value="'+(C.sl_sell_pct==null?100:C.sl_sell_pct)+'"><span class="lbl">%</span></div>'+
    '<div class="ovrow"><span class="lbl">CONFIRM</span><input id="sTicks" value="'+(C.confirm_ticks==null?2:C.confirm_ticks)+'">'+
      '<span class="lbl" title="consecutive 3s price polls past the line before it sells — stops one bad tick dumping a position">ticks past the line</span></div>'+
    '<div class="ovrow"><span class="lbl">MAX PX AGE</span><input id="sAge" value="'+(C.max_price_age_s==null?20:C.max_price_age_s)+'">'+
      '<span class="lbl" title="a price older than this blocks all selling — a dead feed must not look like a flat market">s before it refuses to act</span></div>'+
    '<div class="ovrow"><span class="lbl">SOUND</span><button class="fm'+(SOUND?' on':'')+'" id="sSnd">'+(SOUND?'ON':'OFF')+'</button></div>'+
    (per?'<h1 style="margin-top:12px">PER POSITION <span style="color:#7a6a63">(blank = use above)</span></h1>'+per:'')+
    paperPanel()+
    '<div class="ovnote"><b style="color:#e9ddd8">These limits live on the trader, not in this window.</b> '+
    'The executor watches and sells with the box closed &mdash; but only while ARMED, and only for positions marked '+
    '<span class="up">AUTO</span>. A position is AUTO when its entry price was rebuilt from chain-verified fills and the '+
    'on-chain balance agrees with them. Anything else is <span class="dn">MANUAL</span>: it still shows a live %, still '+
    'raises the banner with a one-click SELL, and is never sold for you. '+
    'Percentages are against what the position cost in SOL (average cost over fills), not a session high.</div>'+
    '<div class="ovrow" style="margin-top:10px"><span style="flex:1"></span>'+
    '<button class="fm" id="sClose">CLOSE</button></div></div>';
  document.body.appendChild(ov);
  ov.onclick=function(e){ if(e.target===ov) cogClose(); };
  var num=function(id,dflt){ var v=parseFloat($(id).value); return isNaN(v)?dflt:Math.abs(v); };
  var commit=async function(){
    var per={};
    Array.prototype.forEach.call(document.querySelectorAll('.ptp,.psl'),function(i){
      var m=i.getAttribute('data-m'), k=i.className==='ptp'?'tp':'sl';
      var v=i.value.trim();
      if(v===''){ return; }
      var n=parseFloat(v);
      // isNaN, NOT `||undefined` — the old form turned a 0 into "unset", so a
      // 0% stop (get me out at break-even) was the one limit you could not set.
      if(isNaN(n)) return;
      per[m]=per[m]||{}; per[m][k]=Math.abs(n);
    });
    var body={tp_pct:num('sTp',gtp), sl_pct:num('sSl',gsl),
              tp_sell_pct:num('sTpAmt',100), sl_sell_pct:num('sSlAmt',100),
              confirm_ticks:num('sTicks',2), max_price_age_s:num('sAge',20),
              per:per};
    try{
      var j=await jpost(ep('/tpsl/config'),body);
      if(j&&j.ok){ SRV=j; paintArm(); paintBook(); render(); checkAlerts();
                   log('TP/SL limits saved to '+(SRV.book==='paper'?'the paper book':'trader'),'#ffb020'); }
      else log('saving limits failed: '+esc((j&&j.error)||'?'),'#ff5a5f');
    }catch(e){ log('saving limits failed: '+esc(e),'#ff5a5f'); }
  };
  $('sSnd').onclick=function(){ SOUND=!SOUND;
    $('sSnd').textContent=SOUND?'ON':'OFF';
    $('sSnd').className='fm'+(SOUND?' on':'');
    if(SOUND) beep('tp');                 // also unlocks AudioContext on a gesture
    try{ localStorage.setItem('t8_tpsl_snd',SOUND?'1':'0'); }catch(e){} };
  $('sClose').onclick=function(){ commit(); cogClose(); };
  Array.prototype.forEach.call(ov.querySelectorAll('input'),function(i){
    i.addEventListener('change',commit); });

  /* paper controls. Kept OUT of commit(): that function posts to
     /tpsl/config, and the fee model is a different endpoint on a different
     object. Wiring them together would mean every TP/SL edit also rewrote the
     book's economics. */
  if($('pReset')){
    var pset=async function(body){
      try{
        var j=await jpost('/api/paper/settings',body);
        if(j&&j.ok){ SRV=j; paintBook(); paintPaperBar(); }
        else log('paper settings failed: '+esc((j&&j.error)||'?'),'#ff5a5f');
      }catch(e){ log('paper settings failed: '+esc(e),'#ff5a5f'); }
    };
    $('pHair').addEventListener('change',function(){
      var v=parseFloat($('pHair').value); if(!isNaN(v)) pset({fill_haircut_bps:Math.abs(v)}); });
    $('pRent').onclick=async function(){
      var on=!(SRV.paper&&SRV.paper.charge_ata_rent);
      await pset({charge_ata_rent:on});
      $('pRent').textContent=on?'CHARGED':'OFF';
      $('pRent').className='fm'+(on?' on':'');
    };
    // RESET is destructive to the CURRENT RUN's numbers (the rows survive, the
    // balance does not), so it confirms with the figure it is about to replace.
    $('pReset').onclick=async function(){
      var v=parseFloat($('pBank').value);
      if(isNaN(v)||v<=0){ log('bankroll must be > 0','#ff5a5f'); return; }
      var s=SRV.stats||{};
      if(!confirm('Reset the paper book to '+v+' ◎?\n\n'+
                  'Open paper positions ('+(s.open||0)+') and '+
                  (s.net_sol>=0?'+':'')+Number(s.net_sol||0).toFixed(4)+' ◎ of '+
                  'P&L stop counting. The rows stay in the journal under the old epoch.')) return;
      try{
        var j=await jpost('/api/paper/reset',{start_sol:v});
        if(j&&j.ok){ SRV=j; rows=j.positions||[]; BEEPED={}; MUTED={};
                     paintArm(); paintBook(); render(); paintPaperBar();
                     log('paper book reset — '+v+' ◎','#38d0ff'); cogClose(); }
        else log('reset failed: '+esc((j&&j.error)||'?'),'#ff5a5f');
      }catch(e){ log('reset failed: '+esc(e),'#ff5a5f'); }
    };
  }
}
$('cog').onclick=cogOpen;
$('arm').onclick=toggleArm;
$('book').onclick=toggleBook;

/* Polling: BACK OFF when hidden, never stop.
   The first version cleared the interval on document.hidden, copying the
   dashboard's gate. That was wrong here and it froze the box in his hands:
   this window's whole job is to sit behind a gmgn window, so "hidden" is its
   NORMAL working state, not idleness. Worse, in a Document PiP window Chrome
   ties the injected document's visibility to the OPENER TAB — so clicking over
   to gmgn hid the dashboard, which hid this document, which killed the timer at
   the exact moment he started using it.

   Backing off keeps the Helius saving that motivated the gate (a forgotten box
   drops from 6s to 30s) while guaranteeing the numbers still move. If the
   visibilitychange event never fires in a PiP document at all, the failure mode
   is now "keeps polling at 6s" — stale data is the one thing a trade window
   must never show. The dashboard KEEPS its hard stop; an idle tab behind gmgn
   really is doing nothing useful.

   ONE CAVEAT THAT NO LONGER APPLIES: this poll used to be the stop-loss's
   heartbeat, so backing it off traded protection for RPC budget. It is now
   only a VIEW refresh — tpsl.py watches prices every 3s inside the trader and
   keeps selling whether this window is polling, backed off, or shut. So the
   cold interval can be generous without weakening anything. */
var HOT_MS=3000, COLD_MS=15000;
var timer=null, timerMs=0;
function pollsSet(ms){
  if(timer!==null && timerMs===ms) return;
  if(timer!==null) clearInterval(timer);
  timerMs=ms; timer=setInterval(tickView,ms);
}
async function tickView(){ await refresh(); checkAlerts(); }
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ pollsSet(COLD_MS); }
  else { tickView(); pollsSet(HOT_MS); }
});
paintBook();          // paints the unconfirmed intent until the first poll lands
tickView();
pollsSet(document.hidden?COLD_MS:HOT_MS);
</script>
